    <radialGradient id="right"><stop stop-color="#1e3552" stop-opacity=".78"/><stop offset=".48" stop-color="#617b94" stop-opacity=".35"/><stop offset="1" stop-color="#e8eeeb" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17384f" flood-opacity=".12"/></filter>
